<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>
    <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/x-icon">
    <link href="./src/style.css" rel="stylesheet" />
</head>

<body
    class="text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 md:p-8 lg:p-12 relative overflow-x-hidden font-sans">

    <!-- Top-Left & Bottom-Right Corner Orbs -->
    <div
        class="absolute -top-24 -left-24 w-48 h-48 sm:w-80 sm:h-80 bg-sky-500/30 rounded-full blur-2xl sm:blur-3xl pointer-events-none orb-top-left">
    </div>
    <div
        class="absolute -bottom-24 -right-24 w-48 h-48 sm:w-80 sm:h-80 bg-indigo-500/30 rounded-full blur-2xl sm:blur-3xl pointer-events-none orb-bottom-right">
    </div>

    <!-- Main Card Container -->
    <main
        class="w-full max-w-xs sm:max-w-xl md:max-w-2xl lg:max-w-4xl xl:max-w-5xl bg-slate-900/80 backdrop-blur-xl border rounded-2xl sm:rounded-3xl p-4 sm:p-8 lg:p-10 shadow-2xl relative z-10 animated-card-border my-auto">
        <header class="mb-6 sm:mb-8 text-center md:text-left">
            <h1 class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold tracking-tight text-slate-100">Tip
                Calculator</h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1">Split bills effortlessly with clean minimalism.</p>
        </header>

        <!-- Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8 lg:gap-12 items-stretch">
            <section class="space-y-4 sm:space-y-6 flex flex-col justify-between">
                <!-- Bill Input -->
                <div>
                    <label for="bill"
                        class="block text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 sm:mb-2">
                        Bill Amount (৳)
                    </label>
                    <div class="relative">
                        <span
                            class="absolute inset-y-0 left-0 flex items-center pl-3.5 sm:pl-4 text-slate-500 text-base sm:text-lg">৳</span>
                        <input type="number" id="bill" placeholder="0.00" min="0" step="0.01"
                            class="animated-input w-full pl-8 sm:pl-9 pr-3 sm:pr-4 py-2.5 sm:py-3 bg-slate-800/60 border border-slate-700/80 rounded-lg sm:rounded-xl text-slate-100 text-sm sm:text-base placeholder-slate-600 focus:outline-none" />
                    </div>
                </div>

                <!-- Tip Selection -->
                <div>
                    <label
                        class="block text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 sm:mb-2">
                        Select Tip %
                    </label>
                    <div id="tip-container" class="grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-3">
                        <button type="button" data-tip="5"
                            class="tip-btn py-2 sm:py-2.5 bg-slate-800 rounded-lg sm:rounded-xl text-xs sm:text-sm font-medium">5%</button>
                        <button type="button" data-tip="10"
                            class="tip-btn py-2 sm:py-2.5 bg-slate-800 rounded-xl text-xs sm:text-sm font-medium">10%</button>
                        <button type="button" data-tip="15"
                            class="tip-btn py-2 sm:py-2.5 bg-slate-800 rounded-xl text-xs sm:text-sm font-medium">15%</button>
                        <button type="button" data-tip="20"
                            class="tip-btn py-2 sm:py-2.5 bg-slate-800 rounded-xl text-xs sm:text-sm font-medium">20%</button>
                        <button type="button" data-tip="25"
                            class="tip-btn py-2 sm:py-2.5 bg-slate-800 rounded-xl text-xs sm:text-sm font-medium">25%</button>
                        <input type="number" id="custom-tip" placeholder="Custom" min="0"
                            class="animated-input col-span-1 sm:col-span-1 w-full py-2 sm:py-2.5 px-2.5 sm:px-3 bg-slate-800/60 border border-slate-700/80 rounded-lg sm:rounded-xl text-center text-slate-100 text-xs sm:text-sm placeholder-slate-500 focus:outline-none" />
                    </div>
                </div>

                <!-- Number of People Input -->
                <div>
                    <label for="people"
                        class="block text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 sm:mb-2">
                        Number of People
                    </label>
                    <input type="number" id="people" placeholder="1" value="1" min="1"
                        class="animated-input w-full px-3.5 sm:px-4 py-2.5 sm:py-3 bg-slate-800/60 border border-slate-700/80 rounded-lg sm:rounded-xl text-slate-100 text-sm sm:text-base placeholder-slate-600 focus:outline-none" />
                </div>
            </section>

            <!-- Display Section (Right) -->
            <section
                class="bg-slate-950/70 border border-slate-800 rounded-xl sm:rounded-2xl p-4 sm:p-6 lg:p-8 flex flex-col justify-between space-y-6 mt-2 md:mt-0">
                <div class="space-y-4 sm:space-y-6">
                    <div class="flex items-center justify-between gap-2">
                        <div>
                            <p class="text-xs sm:text-sm font-medium text-slate-200">Tip Amount</p>
                            <p class="text-[10px] sm:text-xs text-slate-500">per person</p>
                        </div>
                        <p id="tip-amount"
                            class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-sky-400 inline-block transition-all duration-200 origin-right truncate">
                            ৳0.00</p>
                    </div>
                    <hr class="border-slate-800/80" />
                    <div class="flex items-center justify-between gap-2">
                        <div>
                            <p class="text-xs sm:text-sm font-medium text-slate-200">Total</p>
                            <p class="text-[10px] sm:text-xs text-slate-500">per person</p>
                        </div>
                        <p id="total-amount"
                            class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-slate-100 inline-block transition-all duration-200 origin-right truncate">
                            ৳0.00</p>
                    </div>
                </div>

                <!-- Reset Button -->
                <button type="button" id="reset-btn"
                    class="animated-input w-full py-2.5 sm:py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-sky-400 text-slate-300 hover:text-slate-100 text-[10px] sm:text-xs font-bold uppercase tracking-widest rounded-lg sm:rounded-xl transition-all duration-150 active:scale-95 hover:shadow-lg hover:shadow-sky-500/10 mt-4">
                    Reset
                </button>
            </section>
        </div>
    </main>
</body>

</html>
